    nX /= len; nY /= len; nZ /= len;
    // Same brightness/redness formula as the rest of the terrain (see
    // emitTri()/pushVert() elsewhere) so a mined near-field chunk reads
    // as visually consistent with ordinary ground and with itself
    // whether you're looking at open ground or into a tunnel wall.
    let bright = 0.30 + Math.abs(nY) * 0.55 + (Math.abs(nX) + Math.abs(nZ)) * 0.30;
    bright = Math.max(0.12, Math.min(1, bright));
    const NATURAL = [ny0, ny1, ny2];
    for (let t = 0; t < 3; t++) {
      const p = t === 0 ? p0 : t === 1 ? p1 : p2;
      pos.push(p[0], p[1], p[2]);
      nrm.push(nX, nY, nZ);
      const hardness = hardnessAtY(NATURAL[t], p[1]);
      const red = Math.min(1, hardness / 100);
      col.push(bright*(1-red)+red, bright*(1-red*0.85), bright*(1-red*0.85));
      bary.push(BARY[t][0], BARY[t][1], BARY[t][2]);
    }
  };
  for (const q of vquads) {
    const p0 = toWorld(q[0]), p1 = toWorld(q[1]), p2 = toWorld(q[2]), p3 = toWorld(q[3]);
    const h0 = naturalYAtIdx(q[0]), h1 = naturalYAtIdx(q[1]), h2 = naturalYAtIdx(q[2]), h3 = naturalYAtIdx(q[3]);
    pushVolTri(p0, p1, p2, h0, h1, h2);
    pushVolTri(p0, p2, p3, h0, h2, h3);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(nrm), 3));
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(col), 3));
  geo.setAttribute('barycentric', new THREE.BufferAttribute(new Float32Array(bary), 3));
  geo.computeBoundingSphere();

  // Shares terrainMaterial with ordinary chunks — no skirt geometry of
  // its own, so every triangle is "main" for the mining raycaster
  // (mainVertCount = all vertices).
  const mesh = new THREE.Mesh(geo, terrainMaterial);
  mesh.frustumCulled = true;
  mesh.matrixAutoUpdate = false;
  mesh.matrixWorldAutoUpdate = false;
  mesh.name = 'finePatch';
  const triCount = pos.length / 9;
  return { mesh, triCount, mainVertCount: pos.length / 3 };
}

// ---------------------------------------------------------------------
// Chunk manager: LOD ring selection, generation queue, retention, cache
// ---------------------------------------------------------------------
const chunkEntries = new Map();   // key -> { mesh, triCount, level, cx, cz } — currently IN the scene
const pendingRemoval = new Set(); // keys in chunkEntries that are no longer needed, but kept
                                   // visible as a fallback until every currently-queued
                                   // replacement chunk has actually finished generating —
                                   // this is what prevents the "hole while regenerating" bug.
const chunkCache = new Map();     // key -> { mesh, triCount, level, cx, cz } — NOT in scene,
                                   // geometry retained so walking back doesn't rebuild it.
const CHUNK_CACHE_MAX = 96;       // bounded so memory can't grow without limit
// Keys whose INSTALLED mesh is stale (a terrain edit landed inside its
// footprint) but hasn't been rebuilt yet — see invalidateChunksAt() and
// the "lag spike after a mining tick" note on processQueue() below.
const dirtyChunks = new Set();
let genQueue = [];
let runningTriCount = 0;
const CHUNKS_PER_FRAME = 2; // spread generation cost across frames

function keyFor(level, cx, cz) { return level + '_' + cx + '_' + cz; }

// Merge the main terrain geometry and the skirt geometry (from buildChunk,
// unchanged) into a single non-indexed BufferGeometry with two material
// groups, so a chunk is one Mesh/one scene-graph object instead of a Group
// with two child Meshes — same seams, same triangles, less traversal/object
// overhead. Disposes the two source geometries once merged.
function mergeChunkGeometries(mainGeo, skirtGeo) {
  const mp = mainGeo.attributes.position.array, mn = mainGeo.attributes.normal.array, mc = mainGeo.attributes.color.array, mb = mainGeo.attributes.barycentric.array;
  const sp = skirtGeo.attributes.position.array, sn = skirtGeo.attributes.normal.array, sc = skirtGeo.attributes.color.array, sb = skirtGeo.attributes.barycentric.array;
  const pos = new Float32Array(mp.length + sp.length); pos.set(mp, 0); pos.set(sp, mp.length);
  const norm = new Float32Array(mn.length + sn.length); norm.set(mn, 0); norm.set(sn, mn.length);
  const col = new Float32Array(mc.length + sc.length); col.set(mc, 0); col.set(sc, mc.length);
  const bary = new Float32Array(mb.length + sb.length); bary.set(mb, 0); bary.set(sb, mb.length);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(norm, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('barycentric', new THREE.BufferAttribute(bary, 3));
  const mainCount = mp.length / 3, skirtCount = sp.length / 3;
  geo.addGroup(0, mainCount, 0);              // material 0 = terrainMaterial (FrontSide)
  geo.addGroup(mainCount, skirtCount, 1);      // material 1 = skirtMaterial (DoubleSide)
  geo.computeBoundingSphere();
  mainGeo.dispose();
  skirtGeo.dispose();
  return geo;
}

function disposeEntry(entry) { entry.mesh.geometry.dispose(); }

// Bounded LRU-ish cache: re-inserting a key bumps it to "most recently used"
// (Map iteration order), so eviction (when over CHUNK_CACHE_MAX) always
// drops the least-recently-touched entry first.
function cachePut(key, entry) {
  if (chunkCache.has(key)) chunkCache.delete(key);
  chunkCache.set(key, entry);
  while (chunkCache.size > CHUNK_CACHE_MAX) {
    const oldestKey = chunkCache.keys().next().value;
    disposeEntry(chunkCache.get(oldestKey));
    chunkCache.delete(oldestKey);
  }
}

function neededSet(viewLevel, px, pz) {
  const set = new Map();
  // Running bounding box of everything already covered by finer levels
  // (world-space, exact chunk-grid-aligned rect — NOT based on the raw
  // continuous player position, since that's what caused the seam bug:
  // a coarser chunk was being skipped whenever it was "close enough" to
  // the player in a straight-line sense, but the finer level underneath
  // it is quantized to its own chunk grid, which is out of phase with the
  // player's continuous position by up to one chunk. That phase mismatch
  // is exactly the intermittent one-chunk-wide hole — its side flips
  // depending on which way that quantization currently leans as you move.
  let covMinX = 0, covMaxX = 0, covMinZ = 0, covMaxZ = 0;
  for (let level = 0; level < viewLevel; level++) {
    const size = chunkWorldSize(level);
    const ccx = Math.floor(px / size), ccz = Math.floor(pz / size);
    // Fine near-field patches only ever apply at level 0 (finest LOD ring)
    // and only within a small, fixed radius of the player's CURRENT chunk
    // — capped to RING_RADIUS so it never asks for a chunk outside what's
    // needed anyway. Every other LOD level already renders at its own
    // fine detail via buildChunk()+QEM, so this never touches level > 0.
    const fineRadius = level === 0 ? Math.min(NEAR_FIELD_RADIUS, RING_RADIUS) : -1;
    for (let dz = -RING_RADIUS; dz <= RING_RADIUS; dz++) {
      for (let dx = -RING_RADIUS; dx <= RING_RADIUS; dx++) {
        const cx = ccx + dx, cz = ccz + dz;
        const wx0 = cx * size, wx1 = wx0 + size;
        const wz0 = cz * size, wz1 = wz0 + size;
        // Only skip if this chunk's ENTIRE footprint already lies inside
        // the actual (grid-aligned) coverage of finer levels — a partial
        // overlap is kept rather than dropped, so we can only ever get
        // (harmless) double-coverage at a boundary, never a gap.
        if (level > 0 && wx0 >= covMinX && wx1 <= covMaxX && wz0 >= covMinZ && wz1 <= covMaxZ) continue;
        const isFine = fineRadius >= 0 && Math.abs(dx) <= fineRadius && Math.abs(dz) <= fineRadius;
        set.set(keyFor(level, cx, cz), [level, cx, cz, isFine]);
      }
    }
    // Expand the covered rect to this level's full candidate ring (in world
    // space), so the next, coarser level tests containment against reality.
    const bx0 = (ccx - RING_RADIUS) * size, bx1 = (ccx + RING_RADIUS + 1) * size;
    const bz0 = (ccz - RING_RADIUS) * size, bz1 = (ccz + RING_RADIUS + 1) * size;
    if (level === 0) {
      covMinX = bx0; covMaxX = bx1; covMinZ = bz0; covMaxZ = bz1;
      // Force every level-0 chunk that has any density edit in it
      // (minedChunkBounds) into the needed set as a fine/volumetric
      // chunk — regardless of RING_RADIUS or NEAR_FIELD_RADIUS, i.e.
      // even if it's well outside the player's immediate near field.
      // This is what keeps a tunnel's walls/roof/floor drawn (and, via
      // buildAndInstallChunk's fine path, correctly hollow) no matter how
      // far the player has walked from it, instead of the chunk reverting
      // to an ordinary buildChunk() mesh — which has no representation
      // for a vertical gap at all — the moment it falls outside the near
      // field. Each forced chunk's footprint is also folded into the
      // level-0 coverage rect so the coarser-level loop below correctly
      // skips drawing an (unmined) heightfield chunk on top of it — that
      // skip is what stops the two-surfaces-at-once flicker at the
      // near-field boundary.
      for (const ckey of minedChunkBounds.keys()) {
        const [tcx, tcz] = level0ChunkXZFromKey(ckey);
        set.set(keyFor(0, tcx, tcz), [0, tcx, tcz, true]);
        const twx0 = tcx * size, twx1 = twx0 + size;
        const twz0 = tcz * size, twz1 = twz0 + size;
        if (twx0 < covMinX) covMinX = twx0;
        if (twx1 > covMaxX) covMaxX = twx1;
        if (twz0 < covMinZ) covMinZ = twz0;
        if (twz1 > covMaxZ) covMaxZ = twz1;
      }
    }
    else { covMinX = Math.min(covMinX, bx0); covMaxX = Math.max(covMaxX, bx1); covMinZ = Math.min(covMinZ, bz0); covMaxZ = Math.max(covMaxZ, bz1); }
  }
  return set;
}

// Lower score = generated sooner. Level dominates (finer LOD first); within
// the same level, closer chunks go first; facing direction is a minor
// tiebreaker so roughly-in-front chunks edge out ones behind the camera.
function chunkPriority(level, cx, cz, px, pz, fx, fz) {
  const size = chunkWorldSize(level);
  const centerX = (cx + 0.5) * size, centerZ = (cz + 0.5) * size;
  const dx = centerX - px, dz = centerZ - pz;
  const dist = Math.hypot(dx, dz);
  const front = dist > 0 ? (dx * fx + dz * fz) / dist : 1; // 1 = ahead, -1 = behind
  const facingPenalty = (1 - front) * size; // scaled by chunk size so it stays a minor nudge at every LOD level
  return level * 1e7 + dist + facingPenalty;
}

function updateChunks() {
  const needed = neededSet(viewLevel, camera.position.x, camera.position.z);

  // Mark chunks that are no longer needed as obsolete, but do NOT touch the
  // scene yet — they stay rendered as a fallback. If a chunk that was
  // marked obsolete becomes needed again (player backtracked), un-mark it.
  for (const key of chunkEntries.keys()) {
    if (!needed.has(key)) pendingRemoval.add(key);
  }
  for (const key of pendingRemoval) {
    if (needed.has(key)) pendingRemoval.delete(key);
  }

  // Build the generation queue for needed chunks not currently in the
  // scene. A chunk sitting in the cache is reinstated directly (no
  // buildChunk() call); only a true miss goes on the queue.
  const px = camera.position.x, pz = camera.position.z;
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw); // camera forward, projected to XZ
  genQueue = [];
  for (const [key, val] of needed) {
    const [level, cx, cz, fine] = val;
    const existing = chunkEntries.get(key);
    // Fine-ness mismatch (see evictEntry() above) means the installed mesh
    // is the wrong variant for what's needed now — fall through and queue
    // a rebuild instead of treating the key's mere presence as "done".
    if (existing) {
      // Same variant AND not stale from a mining edit: truly done, skip.
      // A dirty entry stays in the queue even though its variant already
      // matches — see processQueue()'s note on why that rebuild is left
      // to the throttle instead of happening here.
      if (existing.fine === fine && !dirtyChunks.has(key)) continue;
    } else if (chunkCache.has(key)) {
      const entry = chunkCache.get(key);
      if (entry.fine === fine) {
        chunkCache.delete(key);
        scene.add(entry.mesh);
        chunkEntries.set(key, entry);
        runningTriCount += entry.triCount;
        continue;
      }
      // Wrong-variant cache entry — leave it for normal LRU eviction later
      // and fall through to queue a fresh build of the correct variant.
    }
    genQueue.push({ key, level, cx, cz, fine, score: chunkPriority(level, cx, cz, px, pz, fx, fz) });
  }
  genQueue.sort((a, b) => b.score - a.score); // ascending priority popped from the end

  maybeFlushObsolete();
}

// A stale chunk is safe to retire once nothing still queued would show up
// in its footprint — NOT once the whole global genQueue is empty. Gating
// on the whole queue was the bug: in an effectively infinite world the
// player keeps moving, so genQueue is almost never fully empty, which
// meant stale chunks (e.g. the near-field patches built back at spawn)
// sat in pendingRemoval — still rendered, still in the scene — forever,
// no matter how far away the player walked. They'd only get visually
// buried once some later, larger LOD chunk happened to be drawn over/
// around them, which is exactly the "stays put and gets covered up by
// LODs" symptom.
function footprintStillQueued(entry) {
  const size = chunkWorldSize(entry.level);
  const wx0 = entry.cx * size, wx1 = wx0 + size;
  const wz0 = entry.cz * size, wz1 = wz0 + size;
  for (const q of genQueue) {
    const qsize = chunkWorldSize(q.level);
    const qx0 = q.cx * qsize, qx1 = qx0 + qsize;

  for (const b of bands) {
    const dist = Math.abs(b.top - landingY);
    if (dist < bestDist) { bestDist = dist; landingBand = b; }
  }
  const yHigh = landingY + PLAYER_HEIGHT;
  for (const b of bands) {
    if (b === landingBand) continue;
    if (b.top > landingY && b.bottom < yHigh) return true;
  }
  return false;
}
function columnBlockedForPlayer(x, z, feetYNow) {
  const landingY = steppableLandingY(x, z, feetYNow);
  if (landingY === null) return true; // nothing reachable within a step — a wall
  return headroomBlocked(x, z, landingY);
}
// Four probe points around the player's own radius, in addition to the
// center — cheap point sampling rather than a true swept capsule, but
// enough to stop a wall from being skippable by aiming a corner through
// it, which a single center-point check would allow.
function playerBlockedAt(x, z, feetYNow) {
  if (columnBlockedForPlayer(x, z, feetYNow)) return true;
  const r = PLAYER_RADIUS;
  return columnBlockedForPlayer(x + r, z, feetYNow) ||
         columnBlockedForPlayer(x - r, z, feetYNow) ||
         columnBlockedForPlayer(x, z + r, feetYNow) ||
         columnBlockedForPlayer(x, z - r, feetYNow);
}
// Axis-separated move-and-slide: try the full desired step; if blocked,
// try each axis alone so the player slides along a wall instead of
// stopping dead the instant they're not moving exactly parallel to it.
function resolveHorizontalMove(dx, dz) {
  const feetYNow = feetY;
  const tryX = feetX + dx, tryZ = feetZ + dz;
  if (!playerBlockedAt(tryX, tryZ, feetYNow)) { feetX = tryX; feetZ = tryZ; return; }
  if (dx !== 0 && !playerBlockedAt(tryX, feetZ, feetYNow)) { feetX = tryX; return; }
  if (dz !== 0 && !playerBlockedAt(feetX, tryZ, feetYNow)) { feetZ = tryZ; return; }
  // Both axes blocked — stay put this frame.
}

function updateMovement(dt) {
  // Look direction (full pitch+yaw) drives only the camera's orientation.
  _lookEuler.set(pitch, yaw, 0, 'YXZ');
  camera.quaternion.setFromEuler(_lookEuler);

  // Walk direction uses yaw only, so looking up/down doesn't fly the
  // player into the terrain or the sky — that's the "grounded" part.
  _yawEuler.set(0, yaw, 0, 'YXZ');
  _yawQuat.setFromEuler(_yawEuler);
  _forward.set(0, 0, -1).applyQuaternion(_yawQuat);
  _right.set(1, 0, 0).applyQuaternion(_yawQuat);

  const sprint = (keys['ShiftLeft'] || keys['ShiftRight']) ? SPRINT_MULT : 1;
  const speed = BASE_SPEED * sprint;
  const move = _move.set(0, 0, 0);
  if (keys['KeyW']) move.add(_forward);
  if (keys['KeyS']) move.sub(_forward);
  if (keys['KeyD']) move.add(_right);
  if (keys['KeyA']) move.sub(_right);
  if (move.lengthSq() > 0) {
    move.normalize();
    // Was: feetX/feetZ += unconditionally, with no wall check at all (see
    // resolveHorizontalMove() above for why that made every wall, tunnel
    // or ordinary cliff, purely cosmetic).
    resolveHorizontalMove(move.x * speed * dt, move.z * speed * dt);
  }

  // Gravity + ground collision against the LIVE (possibly mined, possibly
  // tunneled) terrain directly under the player's feet.
  playerVelY += GRAVITY * dt;
  feetY += playerVelY * dt;
  const ground = groundBelowFeet(feetX, feetZ, feetY);
  if (feetY <= ground) {
    feetY = ground;
    playerVelY = 0;
    grounded = true;
  } else {
    grounded = false;
  }
  if (keys['Space'] && grounded) {
    playerVelY = JUMP_SPEED;
    grounded = false;
  }

  camera.position.set(feetX, feetY + EYE_HEIGHT, feetZ);
  coordsEl.textContent = `x: ${feetX.toFixed(1)}   y: ${feetY.toFixed(1)}   z: ${feetZ.toFixed(1)}`;

  const size0 = chunkWorldSize(0);
  const ccx = Math.floor(feetX / size0), ccz = Math.floor(feetZ / size0);
  if (ccx !== lastCCX || ccz !== lastCCZ) {
    lastCCX = ccx; lastCCZ = ccz;
    updateChunks();
  }
  // Unconditional, every single frame, no gate: recompute and build the
  // near-field ring around wherever the player is RIGHT NOW. Not "only
  // when we detect a chunk crossing" — every frame, full stop. This is
  // what guarantees the fine/near terrain is glued to the player instead
  // of depending on crossing-detection ever being right.
  ensureNearFieldImmediate(feetX, feetZ);
  ensurePlayerFooting();
}

// ---------------------------------------------------------------------
// Mining: raycast-pick the terrain triangle under the crosshair, hold the
// mouse to break it. On completion this modifies the height "noise point"
// at that column (see the terrain-edit system near the top of the file),
// reloads the affected chunk(s), and rounds the mined triangle's hardness
// into one of four collectible material types added to the hotbar.
// Placement isn't implemented yet — this pass is break + collect only.
// ---------------------------------------------------------------------
const MINE_RANGE = 8; // max reach, world units
const raycaster = new THREE.Raycaster();
raycaster.far = MINE_RANGE;
const _rayDir = new THREE.Vector3();

function pickMiningTarget() {
  if (document.pointerLockElement !== renderer.domElement) return null;
  _rayDir.set(0, 0, -1).applyQuaternion(camera.quaternion);
  raycaster.set(camera.position, _rayDir);
  const targets = [];
  // Only near/fine-LOD chunks are geometrically accurate enough to mine —
  // far coarse chunks are simplified/decimated and don't reflect single
  // triangles anyway, and mining range is short enough this never matters.
  for (const entry of chunkEntries.values()) {
    if (entry.level > 1) continue;
    targets.push(entry.mesh);
  }
  if (!targets.length) return null;
  const hits = raycaster.intersectObjects(targets, false);
  for (const hit of hits) {
    const mainVertCount = hit.object.userData.mainVertCount || 0;
    if (hit.faceIndex * 3 >= mainVertCount) continue; // skirt triangle, not real terrain
    return hit;
  }
  return null;
}

// Materials are rounded from the hardness% (mined depth) of the triangle
// broken — see terrainHardness(). The spec's ranges (soft 0-20%, solid
// 20-40%, strong 40-60%, sturdy 80-99%) leave 60-80% unlabeled; folded
// here into "strong" so there's no dead gap a player could mine into.
function materialTypeForHardness(h) {
  if (h >= MAX_HARDNESS) return null; // bedrock — unminable
  if (h < 20) return 'soft';
  if (h < 40) return 'solid';
  if (h < 80) return 'strong';
  return 'sturdy'; // 80-99
}

const HOTBAR_SIZE = 6;
const HOTBAR_STACK_MAX = 64;
const hotbar = new Array(HOTBAR_SIZE).fill(null); // slot: {type, count} | null

function grantToHotbar(type, amount) {
  if (amount === undefined) amount = 2 + Math.floor(Math.random() * 3); // "a few" per mine: 2-4 (default, single-item grant)
  // Prefer the matching-type slot with the MOST room, so a run of the same
  // material spreads across slots instead of maxing one out while other
  // slots sit empty.
  let best = -1, bestRoom = -1;
  for (let i = 0; i < HOTBAR_SIZE; i++) {
    const slot = hotbar[i];
    if (slot && slot.type === type && slot.count < HOTBAR_STACK_MAX) {
      const room = HOTBAR_STACK_MAX - slot.count;
      if (room > bestRoom) { bestRoom = room; best = i; }
    }
  }
  if (best === -1) {
    // Free-est: an empty slot first. BUG FIXED: this used to leave
    // bestRoom at its initial -1 after picking an empty slot, so the
    // "hotbar completely full" guard below (bestRoom <= 0) treated a
    // perfectly good empty slot as if it had no room and bailed out
    // without ever granting anything — which silently discarded every
    // single mined item forever, since a never-yet-populated slot stays
    // null (this branch) on every subsequent attempt too. Setting
    // bestRoom to a real capacity here is the actual fix.
    for (let i = 0; i < HOTBAR_SIZE; i++) { if (!hotbar[i]) { best = i; bestRoom = HOTBAR_STACK_MAX; break; } }
    if (best === -1) {
      bestRoom = -1;
      for (let i = 0; i < HOTBAR_SIZE; i++) { // else the slot (any type) with the most room
        const room = HOTBAR_STACK_MAX - hotbar[i].count;
        if (room > bestRoom) { bestRoom = room; best = i; }
      }
    }
  }
  if (best === -1 || bestRoom <= 0) return; // hotbar completely full — mined material is lost
  if (!hotbar[best]) hotbar[best] = { type, count: 0 };
  hotbar[best].count = Math.min(HOTBAR_STACK_MAX, hotbar[best].count + amount);
  renderHotbar();
}

const MATERIAL_COLORS = { soft: '#c9b28a', solid: '#9a9a9a', strong: '#6e6e6e', sturdy: '#7a3030' };
const hotbarEl = document.getElementById('hotbar');
const hotbarSlotEls = [];
for (let i = 0; i < HOTBAR_SIZE; i++) {
  const el = document.createElement('div');
  el.className = 'hotslot';
  hotbarEl.appendChild(el);
  hotbarSlotEls.push(el);
}
function renderHotbar() {
  for (let i = 0; i < HOTBAR_SIZE; i++) {
    const slot = hotbar[i], el = hotbarSlotEls[i];
    el.innerHTML = slot
      ? `<div class="swatch" style="background:${MATERIAL_COLORS[slot.type]}"></div><div>${slot.count}</div>`
      : '';
  }
}

const miningBarEl = document.getElementById('miningBar');
const miningBarFillEl = document.getElementById('miningBarFill');
function setMiningUI(p) {
  if (p <= 0) { miningBarEl.style.display = 'none'; miningBarFillEl.style.width = '0%'; return; }
  miningBarEl.style.display = 'block';
  miningBarFillEl.style.width = (p * 100) + '%';
}

let miningColKey = null, miningElapsed = 0, miningDuration = 0;

function updateMining(dt) {
  const hit = (document.pointerLockElement === renderer.domElement && mouseDown) ? pickMiningTarget() : null;
  if (!hit) {
    if (miningColKey !== null) { miningColKey = null; miningElapsed = 0; setMiningUI(0); }
    return;
  }
  const hardness = terrainHardness(hit.point.x, hit.point.y, hit.point.z);
  if (hardness >= MAX_HARDNESS) { // bedrock — can't be mined
    if (miningColKey !== null) { miningColKey = null; miningElapsed = 0; setMiningUI(0); }
    return;
  }
  const key = mineColKey(hit.point.x, hit.point.z);
  if (key !== miningColKey) {
    miningColKey = key;
    miningElapsed = 0;
    // 1s base at 0% hardness, scaling as 1/(1 - hardness/100): 2x at 50%,
    // 4x at 75%, diverging toward infinity as hardness approaches 100%
    // (bedrock, handled as a hard "unminable" cutoff above rather than an
    // actually-infinite wait). Divided by MINE_SPEED_MULT so the whole
    // curve digs proportionally faster while keeping its shape (bedrock
    // still asymptotes to unminable).
    miningDuration = (1.0 / (1 - hardness / 100)) / MINE_SPEED_MULT;
  }
  miningElapsed += dt;
  setMiningUI(Math.min(1, miningElapsed / miningDuration));
  if (miningElapsed >= miningDuration) {
    completeMine(hit.point.x, hit.point.y, hit.point.z);
    miningColKey = null; miningElapsed = 0; setMiningUI(0);
  }
}

// Carves a sphere of world-space radius MINE_RADIUS out of the terrain,
// centered on the actual 3D point that was hit (not just its x,z) — this
// is what makes the dig round instead of a single MINE_STEP-wide flat-
// bottomed square, and what lets aiming sideways (into the wall of a
// pit, into a cliff face, or into the wall of an existing tunnel) carve
// sideways instead of only ever lowering the one column under the
// crosshair.
//
// The dig is a standard SDF/CSG sphere subtraction against the live
// density field: every lattice point within reach gets
// min(currentDensity, distanceToCenter - R) written back — negative
// (air) inside the sphere, completely untouched outside it. Because
// it's a min(), the same dig naturally does the right thing whether it's
// eating into untouched rock, widening a crater, or breaking through
// into a tunnel that's already there: there's no special-casing for "is
// this the first time this column has been touched" the way the old
// per-column band-splitting needed. This is also what makes a snaking,
// spherical tunnel possible in the first place — the sphere doesn't
// care which direction it's approached from.
// Carves the MINE_RADIUS sphere centered at (hx,hy,hz) into densityEdits.
// Pulled out of completeMine() so a no-effect swing (see completeMine()
// below) can retry the exact same carve re-centered on a nearby point
// that actually still has material to remove.
function carveSphereAt(hx, hy, hz) {
  const R = MINE_RADIUS;
  const step = DENS_STEP;
  const span = Math.ceil(R / step) + 1; // +1 lattice-point margin so the sphere's own edge is never clipped
  const ci = densLatticeIndex(hx), cj = densLatticeIndex(hy), ck = densLatticeIndex(hz);
  let touchedAny = false, touchedCount = 0, maxDelta = 0;

  // Loop reordered so dj (vertical) is innermost: naturalY/bedrockY below
  // depend only on the horizontal column (wx,wz from di,dk), not on dj at
  // all, so hoisting the heightAt() call out of the dj loop turns what
  // used to be one 5-octave noise evaluation per LATTICE POINT into one
  // per COLUMN — the same "don't repeat the expensive part per vertical
  // sample" fix as naturalYs in buildFinePatchChunk, applied here to the
  // mining swing itself rather than the chunk rebuild that follows it.
  for (let dk = -span; dk <= span; dk++) {
    for (let di = -span; di <= span; di++) {
      const i = ci + di, k = ck + dk;
      const wx = i * step, wz = k * step;
      const naturalY = heightAt(wx, wz);
      const bedrockY = bedrockYFor(naturalY);
      for (let dj = -span; dj <= span; dj++) {
        const j = cj + dj;
        const wy = j * step;
        const dx = wx - hx, dy = wy - hy, dz = wz - hz;
        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (dist > R + step) continue; // outside the sphere (+ a hair of slack) — leave untouched

        if (wy < bedrockY) continue; // bedrock — an absolute floor, never carved

        const key = densKey(i, j, k);
        const current = densityEdits.has(key) ? densityEdits.get(key) : (naturalY - wy);
        const carved = dist - R; // this point's signed distance to the dig sphere's own surface
        const next = Math.min(current, carved);
        if (next === current) continue; // this dig didn't reach any further than a previous one already did here

        densityEdits.set(key, next);
        minedColumns.add(i + ',' + k);
        touchedAny = true; touchedCount++;
        maxDelta = Math.max(maxDelta, current - next);

        const ckey = level0ChunkKeyFor(wx, wz);
        const b = minedChunkBounds.get(ckey);
        if (!b) minedChunkBounds.set(ckey, { minY: wy, maxY: wy });
        else { if (wy < b.minY) b.minY = wy; if (wy > b.maxY) b.maxY = wy; }
      }
    }
  }
  return { touchedAny, touchedCount, maxDelta };
}

// Below this, a dig's effect is too small to read as "mining actually did
// something" — either it only grazed already-hollow (density <= 0) space,
// or it shaved a sliver too thin to move the surface a visible amount.
const MIN_VISIBLE_DENSITY_DELTA = DENS_STEP * 0.25;

// Walks outward from (hx,hy,hz) shell by shell on the density lattice
// until it finds a lattice point that's still solid (positive density,
// i.e. real un-carved material, and above bedrock) — used when a mining
// swing's own sphere had nothing left to remove right where the player
// aimed. Returns the WORLD coordinates of the nearest such point, or null
// if nothing solid turned up within maxShells (e.g. aiming into the
// middle of a very large hollowed-out cavern).
function findNearestSolidPoint(hx, hy, hz, maxShells) {
  const step = DENS_STEP;
  const ci = densLatticeIndex(hx), cj = densLatticeIndex(hy), ck = densLatticeIndex(hz);
  let best = null, bestDist = Infinity;
  // Same fix as carveSphereAt: naturalY/bedrockY only depend on the
  // horizontal column (di,dk), but the shell's "outer surface only"
  // filter still visits several dj per (di,dk) pair — cache the column
  // result per shell instead of re-running heightAt()'s 5-octave noise
  // for each dj. This path only runs on the rare no-effect-swing retry,
  // so it's a smaller win than carveSphereAt/buildFinePatchChunk, but
  // just as free.
  const columnCache = new Map();
  const columnAt = (di, dk) => {
    const ckey = di + ',' + dk;
    let c = columnCache.get(ckey);
    if (!c) {
      const wx = (ci + di) * step, wz = (ck + dk) * step;
      const naturalY = heightAt(wx, wz);
      c = { wx, wz, naturalY, bedrockY: bedrockYFor(naturalY) };
      columnCache.set(ckey, c);
    }
    return c;
  };
  for (let shell = 0; shell <= maxShells; shell++) {
    columnCache.clear();
    for (let dk = -shell; dk <= shell; dk++) {
      for (let dj = -shell; dj <= shell; dj++) {
        for (let di = -shell; di <= shell; di++) {
          // Only the OUTER surface of this shell — smaller offsets were
          // already checked (and would have already returned) at a
          // previous, smaller shell.
          if (Math.max(Math.abs(di), Math.abs(dj), Math.abs(dk)) !== shell) continue;
          const i = ci + di, j = cj + dj, k = ck + dk;
          const { wx, wz, naturalY, bedrockY } = columnAt(di, dk);
          const wy = j * step;
          if (wy < bedrockY) continue; // bedrock — never a valid dig target
          const key = densKey(i, j, k);
          const density = densityEdits.has(key) ? densityEdits.get(key) : (naturalY - wy);
          if (density <= 0) continue; // already air here — not a fix for "mining did nothing"
          const dist = Math.hypot(wx - hx, wy - hy, wz - hz);
          if (dist < bestDist) { bestDist = dist; best = { x: wx, y: wy, z: wz }; }
        }
      }
    }
    if (best) return best; // nearest shell with any hit is close enough — no need to search further out
  }
  return best;
}

function completeMine(hx, hy, hz) {
  // Depth of the point actually clicked drives the material grant and
  // mining duration, same as before — hardness is about the natural
  // surface at the hit point, independent of how the edits are stored.
  const grantHardness = hardnessAtY(heightAt(hx, hz), hy);

  let { touchedAny, touchedCount, maxDelta } = carveSphereAt(hx, hy, hz);
  let ix = hx, iy = hy, iz = hz; // where the effective carve landed, for invalidation below

  // BUG FIXED: aiming at ground that's already fully hollowed out (density
  // already <= 0 everywhere the sphere reaches), or at a spot where the
  // sphere only shaves a sliver too thin to matter, used to just silently
  // do nothing — no visible change, no material, and (worse) no feedback
  // that the swing "landed" at all. Mining should always have SOME
  // tangible effect on a completed swing: if this carve's own effect was
  // negligible, retarget it at the nearest still-solid lattice point and
  // carve there instead, so the action always removes real material.
  if (!touchedAny || maxDelta < MIN_VISIBLE_DENSITY_DELTA) {
    const nearest = findNearestSolidPoint(hx, hy, hz, 12);
    if (nearest) {
      const retry = carveSphereAt(nearest.x, nearest.y, nearest.z);
      if (retry.touchedAny && retry.maxDelta > maxDelta) {
        ({ touchedAny, touchedCount, maxDelta } = retry);
        ix = nearest.x; iy = nearest.y; iz = nearest.z;
      }
    }
  }

  if (touchedAny) {
    const type = materialTypeForHardness(grantHardness);
    // Scales with how much of the sphere actually landed on new (not
    // already-carved) material, so re-mining the same spot mostly just
    // opens it up further rather than paying out again and again.
    if (type) grantToHotbar(type, Math.max(1, Math.round(touchedCount / 6)));
    invalidateChunksAt(hx, hz, MINE_RADIUS + DENS_STEP * 2);
    if (ix !== hx || iz !== hz) invalidateChunksAt(ix, iz, MINE_RADIUS + DENS_STEP * 2);
  }
}

// ---------------------------------------------------------------------
// Spawn: place the player atop the guaranteed-tallest mountain (origin)
// ---------------------------------------------------------------------
feetX = 0; feetZ = 0.0001; feetY = terrainHeight(feetX, feetZ);
camera.position.set(feetX, feetY + EYE_HEIGHT, feetZ);
// Read the slider's actual DOM value rather than hardcoding it: on a fresh
// load with no prior state it's "2" from the HTML markup (our intended
// default), but browsers silently restore a previously-set <input> value on
// reload WITHOUT firing an 'input'/'change' event — by the time this module
// script runs, that restoration has already happened, so reading it here
// keeps the game in sync with whatever the slider visually shows.
setRingRadius(ringSlider.value);
setViewLevel(slider.value);
lastCCX = Math.floor(feetX / chunkWorldSize(0));
lastCCZ = Math.floor(feetZ / chunkWorldSize(0));
// Belt-and-suspenders: back/forward-cache restores can re-apply a restored
// value slightly AFTER scripts already ran, again without an event. Re-sync
// whenever the page is shown from bfcache.
window.addEventListener('pageshow', (e) => {
  if (e.persisted) { setRingRadius(ringSlider.value); setViewLevel(slider.value); }
});

// ---------------------------------------------------------------------
// Resize
// ---------------------------------------------------------------------
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  updateProjectionMatrix();
});

// ---------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------
const statsEl = document.getElementById('stats');
let lastTime = performance.now();
let fpsAccum = 0, fpsFrames = 0, fpsDisplay = 0, statsTimer = 0;

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  // Forced first, before movement, mining, queue processing, or render:
  // whatever chunk the player is currently in (and its near-field ring)
  // gets built/installed synchronously right here. Nothing else this
  // frame can run ahead of it.
  ensureNearFieldImmediate(feetX, feetZ);
  ensurePlayerFooting();

  updateMovement(dt);
  updateMining(dt);
  processQueue();
  maybeFlushObsolete();

  // Manual clear: reverse-Z requires clearing depth to 0 (not the default 1).
  const gl = renderer.getContext();
  gl.clearColor(0, 0, 0, 1);
  gl.clearDepth(0.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  renderer.render(scene, camera);

  fpsAccum += dt; fpsFrames++; statsTimer += dt;
  if (statsTimer > 0.4) {
    fpsDisplay = Math.round(fpsFrames / fpsAccum);
    fpsAccum = 0; fpsFrames = 0; statsTimer = 0;
    statsEl.textContent = `FPS: ${fpsDisplay} | Chunks: ${chunkEntries.size} | Tris: ${Math.round(runningTriCount)}`;
  }
}
requestAnimationFrame(animate);

window.__debug = {
  completeMine, terrainHeight, terrainHardness, densityEdits, hotbar,
  mineColKey, getBands, sampleDensity, densityAt, DENS_STEP, MINE_STEP,
  LAYER_STEP, MAX_HARDNESS, MINE_RADIUS, minedChunkBounds,
  heightAt, chunkWorldSize,
  feetX: () => feetX, feetZ: () => feetZ,
  dumpEdits: () => Array.from(densityEdits.entries()),
};
</script>
</body>
</html>
